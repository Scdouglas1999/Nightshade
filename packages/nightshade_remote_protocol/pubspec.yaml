name: nightshade_remote_protocol
description: Nightshade 2.0 remote-control protocol — LAN discovery, pairing, secure token management, and channel encryption.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.0
  pointycastle: ^3.7.0
  basic_utils: ^5.7.0
  http2: ^2.3.0
  crypto: ^3.0.0
  drift: ^2.30.0
  path_provider: ^2.1.0
  path: ^1.8.3
  nsd: ^3.0.0
  # v4 couch-grade remote: the self-hostable relay tunnel. Pure-Dart package
  # under tools/ (outside the melos workspace globs), so it is referenced by
  # an explicit path dependency. Re-exported below so the desktop headless
  # bootstrap and the mobile transport consume RelayUplink / RelayTunnelClient
  # without each depending on tools/ directly.
  nightshade_relay:
    path: ../../tools/nightshade_relay

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned across all 10 workspace packages to prevent mixed-version drift.
  # Upgraded from 3.0.2 to ^5.0.0 by CQ-W5-LINTS-UPGRADE (audit-dart §10 #3).
  flutter_lints: ^5.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.4.15
  mocktail: ^1.0.0
