name: nightshade_core
description: Nightshade 2.0 Core - Shared business logic and data models
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  uuid: ^4.3.3
  http: ^1.1.2
  file_selector: ^1.0.3
  web_socket_channel: ^2.4.0
  csv: ^6.0.0
  # Wave 7 Agent 2 — broadcast JPEG rendering for the live-stacking
  # outreach endpoint. `image` is already used by apps/desktop's
  # run_watch_handlers; promoting the dependency here makes the
  # broadcast service work from any consumer of nightshade_core.
  image: ^4.1.7

  # Database
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.18
  # Why direct dep: corruption-recovery pre-check (integrity_check.dart) opens
  # the on-disk file synchronously before drift's LazyDatabase resolves so that
  # a corrupt DB file can be rotated to a forensic backup and recreated before
  # the migrator ever sees it. Drift already pulls sqlite3 transitively; we
  # promote it to direct so the import is explicit and pub-bound.
  sqlite3: ^2.4.0
  path_provider: ^2.1.2
  path: ^1.8.3
  # Why direct dep: DiagnosticDumpService bundles logs/profile/sequence/system
  # info into a single zip via package:archive (audit-observe §4c). Same minor
  # series already used by nightshade_updater so transitive resolution is a
  # no-op.
  archive: ^3.4.10
  # Snippet share/import/export uses SHA-256 over the canonical-encoded
  # snippet body as a tamper-evidence checksum so re-imports of a
  # corrupted / hand-edited file surface a loud, listable error instead
  # of silently loading a malformed snippet. Already a transitive dep of
  # the workspace (via http/drift) — promoting to direct so the import
  # site is explicit and pub-bound.
  crypto: ^3.0.3

  # Wave 5 Agent 5 — secure storage for notification credentials.
  # SMTP passwords, Pushover api_token/user_key, Telegram bot_token,
  # Discord webhook URLs, and MQTT passwords live in the OS keyring
  # (Keychain on macOS, Credential Manager on Windows, libsecret on
  # Linux, EncryptedSharedPreferences/Keychain on Android/iOS). The
  # non-secret config (host, port, from-address, etc.) stays in the
  # app_settings DAO. Plaintext secrets in legacy `app_settings` blobs
  # are migrated on first launch via SecretsStore.migrateFromPlaintext().
  flutter_secure_storage: ^9.2.2

  # Native bridge
  nightshade_bridge:
    path: ../nightshade_bridge
  
  # Planetarium (for catalog access)
  nightshade_planetarium:
    path: ../nightshade_planetarium
  logging: ^1.3.0

dev_dependencies:
  # Pinned across all 10 workspace packages to prevent mixed-version drift.
  # Upgraded from 3.0.2 to ^5.0.0 by CQ-W5-LINTS-UPGRADE (audit-dart §10 #3).
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  drift_dev: ^2.15.0
  riverpod_generator: ^2.3.9
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  # Bundled sample sequences shown in the Sequencer > Library tab.
  # Loaded at runtime via [SampleSequenceService] from rootBundle.
  assets:
    - assets/sample_sequences/

# Workaround for build_runner "Cannot recurse at later or equal phase" bug
# See: https://github.com/dart-lang/build/issues/3822
dependency_overrides:
  build_resolvers: 2.4.2
