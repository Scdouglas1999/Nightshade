name: nightshade_mobile
description: Nightshade Mobile - Companion app for remote monitoring and control
publish_to: 'none'
version: 5.0.0+23

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared packages
  nightshade_core:
    path: ../../packages/nightshade_core
  nightshade_ui:
    path: ../../packages/nightshade_ui
  nightshade_remote_protocol:
    path: ../../packages/nightshade_remote_protocol
  nightshade_app:
    path: ../../packages/nightshade_app
  nightshade_bridge:
    path: ../../packages/nightshade_bridge
  nightshade_planetarium:
    path: ../../packages/nightshade_planetarium
  nightshade_updater:
    path: ../../packages/nightshade_updater

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Database (for local state)
  drift: ^2.30.0
  sqlite3_flutter_libs: ^0.5.18

  # Utilities
  flutter_hooks: ^0.20.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  path_provider: ^2.1.2
  path: ^1.8.3
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0

  # URL launcher
  url_launcher: ^6.2.4

  # mDNS/Bonjour discovery
  nsd: ^3.0.0

  # Secure storage for auth tokens (Keychain / EncryptedSharedPreferences).
  # tokens must not live in plaintext SharedPreferences.
  flutter_secure_storage: ^9.2.2

  # QR code scanning
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1

  # Background operation support
  flutter_foreground_task: ^6.0.0
  flutter_local_notifications: ^18.0.0
  wakelock_plus: ^1.1.0
  battery_plus: ^5.0.0

  # Network connectivity monitoring
  connectivity_plus: ^5.0.0

  # Persists mobile-only preferences (e.g., Android immersive mode toggle).
  # The desktop AppSettings model is mobile-irrelevant for these UI choices.
  shared_preferences: ^2.2.2

  # WebRTC datachannel transport for the live-view fan-out.
  # The mobile companion holds the offerer-side RTCPeerConnection and
  # decodes binary JPEG frames straight out of the datachannel. The
  # WebSocket path remains the fallback when the SDP/ICE exchange fails.
  flutter_webrtc: ^1.4.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned across all 10 workspace packages to prevent mixed-version drift.
  # Upgraded from 3.0.2 to ^5.0.0.
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^3.2.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  # NOTE: the desktop→mobile e2e seam test lives in apps/mobile_e2e, NOT
  # here. A dev-dependency on nightshade_desktop leaks the desktop-only
  # irondash_engine_context plugin into the Android release registrant and
  # breaks `flutter build apk --release`.

flutter:
  uses-material-design: true

  # NOTE: bundled sample sequences for the Sequencer > Library tab live in
  # the nightshade_core package's own pubspec asset declaration. Flutter
  # automatically picks them up as `packages/nightshade_core/assets/...`
  # at runtime via rootBundle — they do NOT need to be re-declared here.
  # Mobile users can browse the Library tab in the companion app.
