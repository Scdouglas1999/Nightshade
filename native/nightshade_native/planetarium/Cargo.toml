[package]
name = "nightshade_planetarium"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "build_hyg_tiles"
path = "src/bin/build_hyg_tiles.rs"

[[bin]]
name = "build_opengnc"
path = "src/bin/build_opengnc.rs"

[[bin]]
name = "build_milky_way"
path = "src/bin/build_milky_way.rs"

[dependencies]
thiserror.workspace = true
tracing.workspace = true
wgpu = { version = "22", features = ["dx12", "vulkan-portability"] }
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
irondash_engine_context = "0.5"
irondash_texture = { path = "vendor/irondash_texture" }
glam = { version = "0.27", features = ["bytemuck"] }
crossbeam-channel = "0.5"
arc-swap = "1.7"
parking_lot = "0.12"
zerocopy = { version = "0.7", features = ["derive"] }
memmap2 = "0.9"
cdshealpix = "0.7"
sgp4 = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "fs", "macros"] }
bitflags = "2"
serde = { workspace = true }
serde_json.workspace = true
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
] }
winapi = { version = "0.3", features = ["d3d12", "dxgi", "dxgitype", "winnt", "handleapi"] }
d3d12 = { version = "22", features = ["libloading"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []
