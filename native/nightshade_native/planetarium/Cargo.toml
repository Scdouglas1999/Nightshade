[package]
name = "nightshade_planetarium"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
wgpu = { version = "22", features = ["dx12", "vulkan-portability"] }
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
irondash_engine_context = "0.5"
irondash_texture = { path = "vendor/irondash_texture" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
] }
winapi = { version = "0.3", features = ["d3d12", "dxgi", "dxgitype", "winnt", "handleapi"] }
d3d12 = { version = "22", features = ["libloading"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []
