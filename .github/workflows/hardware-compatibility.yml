name: Hardware Compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/**"
      - "tools/compat/**"
      - "docs/production-readiness/hardware-compatibility-certification.md"
      - ".github/workflows/hardware-compatibility.yml"

jobs:
  compatibility:
    name: Compatibility Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install INDI simulators
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y indi-bin libindi-dev pkg-config libudev-dev libusb-1.0-0-dev libraw-dev

      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew untap aws/tap || true
          brew install libraw libusb
          libraw_prefix="$(brew --prefix libraw)"
          libusb_prefix="$(brew --prefix libusb)"
          echo "LIBRARY_PATH=$libraw_prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "CPATH=$libraw_prefix/include:$libusb_prefix/include${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$libraw_prefix/lib/pkgconfig:$libusb_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Run compatibility suite
        shell: pwsh
        run: |
          ./tools/compat/hardware_compat.ps1 -Mode run -Strict -Out reports/compat/current-run

      - name: Upload compatibility report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hardware-compatibility-${{ matrix.os }}
          path: reports/compat/current-run
