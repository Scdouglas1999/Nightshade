name: Linux Release Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-release-build.yml'
      - 'apps/desktop/**'
      - 'native/nightshade_native/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tools/production/linux_release_package_metadata.dart'
      - 'melos.yaml'

jobs:
  linux-release-build:
    name: Build Linux Release Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/nightshade_native

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libraw-dev \
            xvfb \
            tar

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Build Linux release bundle
        run: dart run melos run build:desktop:linux --no-select

      - name: Bundle libraw into the Linux release
        run: |
          set -euo pipefail
          # The native bridge dynamically links libraw (-lraw); the Flutter
          # bundle ships libnightshade_bridge.so but not libraw, so the app
          # can't load its bridge on a machine without libraw installed. Copy
          # the resolved libraw shared object into the bundle's lib dir (the
          # executable's rpath is $ORIGIN/lib) so the release is self-contained.
          BUNDLE_LIB="apps/desktop/build/linux/x64/release/bundle/lib"
          if [ ! -d "$BUNDLE_LIB" ]; then
            echo "Bundle lib dir not found: $BUNDLE_LIB" >&2
            exit 1
          fi
          LIBRAW_PATH="$(ldconfig -p | awk '/libraw\.so/ {print $NF; exit}')"
          if [ -z "${LIBRAW_PATH:-}" ] || [ ! -e "$LIBRAW_PATH" ]; then
            echo "libraw shared object not found via ldconfig" >&2
            exit 1
          fi
          cp -Lv "$LIBRAW_PATH" "$BUNDLE_LIB/"
          ls -l "$BUNDLE_LIB" | grep -i raw

      - name: Headless runtime smoke
        run: |
          set -euo pipefail
          mkdir -p build/release-linux
          # The Flutter Linux bundle initialises GTK even in the headless
          # smoke, so it needs a display. CI runners are headless — give it a
          # virtual framebuffer via xvfb so the smoke can actually launch.
          xvfb-run -a dart run tools/production/headless_lan_linux_smoke.dart \
            | tee build/release-linux/headless-runtime-smoke.log

      - name: Generate Linux package metadata
        run: |
          dart run tools/production/linux_release_package_metadata.dart \
            --bundle-dir=apps/desktop/build/linux/x64/release/bundle \
            --output-dir=build/release-linux \
            --artifact-name=nightshade-linux-x64-${{ github.sha }}.tar.gz \
            --metadata-output=docs/production-readiness/linux-release-package-metadata.json \
            --runtime-smoke-log=build/release-linux/headless-runtime-smoke.log \
            --runtime-smoke-passed \
            --write-evidence

      - name: Upload Linux release package
        uses: actions/upload-artifact@v4
        with:
          name: nightshade-linux-x64-${{ github.sha }}
          path: |
            build/release-linux/*.tar.gz
            build/release-linux/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux package metadata
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-package-metadata-${{ github.sha }}
          path: docs/production-readiness/linux-release-package-metadata.json
          if-no-files-found: error
          retention-days: 14
