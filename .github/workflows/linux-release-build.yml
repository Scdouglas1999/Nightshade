name: Linux Release Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-release-build.yml'
      - 'apps/desktop/**'
      - 'native/nightshade_native/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tools/production/linux_release_package_metadata.dart'
      - 'melos.yaml'

jobs:
  linux-release-build:
    name: Build Linux Release Artifact
    # ubuntu-22.04 ships glibc 2.35, under the 2.36 Bookworm/Raspberry Pi OS
    # floor the artifact targets — so binaries built here link symbols the
    # appliance can resolve. Building on ubuntu-latest (glibc 2.39) produces
    # binaries that abort on boot there (caught by the glibc-floor step below).
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/nightshade_native

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libudev-dev \
            libraw-dev \
            xvfb \
            tar

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Build Linux release bundle
        run: dart run melos run build:desktop:linux --no-select

      - name: Bundle native libs + verify the bridge is present
        run: |
          set -euo pipefail
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          BUNDLE_LIB="$BUNDLE/lib"
          if [ ! -d "$BUNDLE_LIB" ]; then
            echo "Bundle lib dir not found: $BUNDLE_LIB" >&2
            exit 1
          fi
          # Fail loudly if the native bridge didn't make it into the bundle —
          # the melos build script runs `cargo build` then `flutter build` and
          # does NOT fail-fast if cargo fails, so a missing system dep would
          # otherwise silently produce a bundle that can't load its bridge.
          if [ ! -e "$BUNDLE_LIB/libnightshade_bridge.so" ]; then
            echo "libnightshade_bridge.so is MISSING from the bundle — the Rust build likely failed." >&2
            ls -l "$BUNDLE_LIB" >&2 || true
            exit 1
          fi
          # The bridge dynamically links libraw (-lraw); ship it in the bundle
          # (executable rpath = $ORIGIN/lib) so the release is self-contained.
          LIBRAW_PATH="$(ldconfig -p | awk '/libraw\.so/ {print $NF; exit}')"
          if [ -z "${LIBRAW_PATH:-}" ] || [ ! -e "$LIBRAW_PATH" ]; then
            echo "libraw shared object not found via ldconfig" >&2
            exit 1
          fi
          cp -Lv "$LIBRAW_PATH" "$BUNDLE_LIB/"
          # Bundle sqlite too. sqlite3_flutter_libs dynamically links the host's
          # libsqlite3.so.0; a bundle compiled against this runner's sqlite ABI
          # crashes in sqlite3_initialize when loaded against a *different*
          # system sqlite on the user's distro (e.g. a rolling-release desktop
          # with a much newer sqlite). Ship the matching sqlite and load it via
          # the launcher below so the app is ABI-consistent everywhere. This
          # MUST match release.yml so the artifact this job produces is the same
          # runnable bundle that ships (BUILD-002).
          SQLITE_PATH="$(ldconfig -p | awk '/libsqlite3\.so\.0/ {print $NF; exit}')"
          if [ -z "${SQLITE_PATH:-}" ] || [ ! -e "$SQLITE_PATH" ]; then
            echo "libsqlite3.so.0 not found via ldconfig" >&2
            exit 1
          fi
          cp -Lv "$SQLITE_PATH" "$BUNDLE_LIB/libsqlite3.so.0"
          # The plugin's DT_NEEDED is "libsqlite3.so.0", but the Dart sqlite3
          # FFI dlopens the unversioned "libsqlite3.so". Provide both names so
          # BOTH resolve to this one bundled copy — otherwise the FFI misses the
          # bundle, falls back to the host's libsqlite3.so, and two mismatched
          # sqlite instances crash in sqlite3_initialize on boot.
          ln -sf libsqlite3.so.0 "$BUNDLE_LIB/libsqlite3.so"
          # Launcher: prepend the bundled lib/ to the loader path so the
          # ABI-matched sqlite/libraw win over whatever the host ships. This is
          # the recommended entry point for the desktop bundle. Written with
          # printf (not a heredoc) so YAML block-indentation can't corrupt it.
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'HERE="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]:-$0}")")" && pwd)"'
            printf '%s\n' 'export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"'
            printf '%s\n' 'exec "$HERE/nightshade_desktop" "$@"'
          } > "$BUNDLE/nightshade"
          chmod +x "$BUNDLE/nightshade"
          echo "Bundle lib contents:"
          ls -l "$BUNDLE_LIB" "$BUNDLE/nightshade"

      - name: Verify runnable-bundle parity with release.yml (sqlite + launcher)
        run: |
          set -euo pipefail
          # BUILD-002 guard: this job's artifact must carry the SAME
          # cross-distro fix release.yml ships — the ABI-matched libsqlite3,
          # the unversioned symlink the Dart FFI dlopens, and the launcher
          # wrapper. Fail loudly if any is missing so the two Linux artifacts
          # can never silently diverge again.
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          BUNDLE_LIB="$BUNDLE/lib"
          fail=0
          if [ ! -e "$BUNDLE_LIB/libsqlite3.so.0" ]; then
            echo "MISSING: $BUNDLE_LIB/libsqlite3.so.0 (ABI-matched sqlite)" >&2; fail=1
          fi
          if [ ! -L "$BUNDLE_LIB/libsqlite3.so" ]; then
            echo "MISSING: $BUNDLE_LIB/libsqlite3.so symlink (Dart FFI dlopen target)" >&2; fail=1
          fi
          if [ ! -x "$BUNDLE/nightshade" ]; then
            echo "MISSING: $BUNDLE/nightshade launcher wrapper" >&2; fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Linux release artifact diverges from release.yml — not a runnable cross-distro bundle (BUILD-002)." >&2
            exit 1
          fi
          echo "Runnable-bundle parity OK (sqlite + symlink + launcher present)."

      - name: Verify glibc floor (Bookworm / Raspberry Pi OS compatibility)
        run: |
          set -euo pipefail
          # This job builds on ubuntu-latest (newer glibc), but the appliance
          # ships on Debian/Raspberry Pi OS Bookworm (glibc 2.36) — both the
          # systemd/Pi installs and the docker appliance (FROM debian:bookworm-slim).
          # A binary that requires a newer glibc aborts on boot there with
          # "GLIBC_2.38 not found", invisible to a smoke test run on this runner.
          # Fail loudly if any bundle binary exceeds the target floor.
          #
          # To make this PASS (not just detect), build on Bookworm: the
          # now-Bookworm-capable scripts/docker_build_linux.sh produces a
          # glibc-2.36 bundle and runs this same check internally —
          #   docker run --rm -e NIGHTSHADE_GLIBC_FLOOR=2.36 \
          #     -v "$PWD":/host:ro -v "$PWD/dist-linux":/out \
          #     debian:bookworm-slim bash /host/scripts/docker_build_linux.sh
          FLOOR="${NIGHTSHADE_GLIBC_FLOOR:-2.36}"
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          floor_major=${FLOOR%%.*}; floor_minor=${FLOOR#*.}
          violations=0
          for bin in "$BUNDLE"/nightshade_desktop "$BUNDLE"/lib/*.so; do
            [ -f "$bin" ] || continue
            maxv=$(objdump -T "$bin" 2>/dev/null \
              | grep -oE 'GLIBC_2\.[0-9]+' | sort -V | tail -1 || true)
            [ -n "$maxv" ] || continue
            v=${maxv#GLIBC_}; major=${v%%.*}; minor=${v#*.}
            if [ "$major" -gt "$floor_major" ] || \
               { [ "$major" -eq "$floor_major" ] && [ "$minor" -gt "$floor_minor" ]; }; then
              echo "VIOLATION: $(basename "$bin") needs $maxv (> $FLOOR)"
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then
            echo "::error::$violations binary(ies) exceed glibc $FLOOR — this artifact will NOT boot on the Bookworm appliance. Build on Bookworm (see comment above)."
            exit 1
          fi
          echo "glibc floor OK (no binary exceeds $FLOOR)"

      - name: Headless runtime smoke
        run: |
          set -euo pipefail
          mkdir -p build/release-linux
          # The Flutter Linux bundle initialises GTK even in the headless
          # smoke, so it needs a display. CI runners are headless — give it a
          # virtual framebuffer via xvfb so the smoke can actually launch.
          xvfb-run -a dart run tools/production/headless_lan_linux_smoke.dart \
            | tee build/release-linux/headless-runtime-smoke.log

      - name: Generate Linux package metadata
        run: |
          dart run tools/production/linux_release_package_metadata.dart \
            --bundle-dir=apps/desktop/build/linux/x64/release/bundle \
            --output-dir=build/release-linux \
            --artifact-name=nightshade-linux-x64-${{ github.sha }}.tar.gz \
            --metadata-output=docs/production-readiness/linux-release-package-metadata.json \
            --runtime-smoke-log=build/release-linux/headless-runtime-smoke.log \
            --runtime-smoke-passed \
            --write-evidence

      - name: Upload Linux release package
        uses: actions/upload-artifact@v4
        with:
          name: nightshade-linux-x64-${{ github.sha }}
          path: |
            build/release-linux/*.tar.gz
            build/release-linux/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux package metadata
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-package-metadata-${{ github.sha }}
          path: docs/production-readiness/linux-release-package-metadata.json
          if-no-files-found: error
          retention-days: 14
