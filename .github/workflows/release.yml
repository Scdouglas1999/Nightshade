name: Release

# Builds the Android APK, Linux bundle, and Windows package, then publishes
# them all to a public GitHub Release. Triggered by pushing a version tag
# (e.g. `git tag v4.1.0 && git push origin v4.1.0`). Windows desktop cannot be
# cross-compiled from Linux, so it builds on a Windows runner here.
#
# `workflow_dispatch` lets you rebuild artifacts on demand; the publish job
# only runs for tag refs.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.1'
  # Artifact version. Bump this in lockstep with the app pubspecs and the tag
  # (e.g. v4.3.0 -> APP_VERSION 4.3.0) so the published file names match.
  APP_VERSION: '4.3.0'

jobs:
  # --------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      # The app's `release` signing config falls back to the standard Android
      # debug keystore. A dev machine already has one (auto-generated on the
      # first build); a clean CI runner does not, and release-signing
      # validation runs before AGP would create it — so make it ourselves with
      # the canonical debug credentials at the locations AGP looks.
      - name: Ensure Android debug keystore exists
        run: |
          set -euo pipefail
          for dir in "$HOME/.android" "$HOME/.config/.android"; do
            ks="$dir/debug.keystore"
            if [ ! -f "$ks" ]; then
              mkdir -p "$dir"
              keytool -genkeypair -v \
                -keystore "$ks" \
                -storepass android -keypass android \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          done

      # The mobile app is a pure-Flutter companion (it talks to the desktop
      # server over HTTP/WS) — no Rust/NDK cross-compilation is required.
      # `flutter build apk --release` produces a universal, debug-signed
      # release APK; no production keystore is configured.
      - name: Build release APK (universal)
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Stage + checksum APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
             "dist/nightshade-${APP_VERSION}-android-universal.apk"
          (cd dist && sha256sum "nightshade-${APP_VERSION}-android-universal.apk" \
             > "nightshade-${APP_VERSION}-android-universal.apk.sha256")
          ls -l dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  linux:
    name: Linux x64
    # Build on Jammy (glibc 2.35), NOT ubuntu-latest (24.04 / glibc 2.39). The
    # shipped appliance runs Debian/Raspberry Pi OS Bookworm (glibc 2.36); a
    # bundle built against a newer glibc aborts on boot there with
    # "GLIBC_2.38 not found". 2.35 < the 2.36 floor, and a 2.35-linked binary
    # runs on every newer glibc, so this satisfies the floor gate below while
    # keeping the host-native build (no Docker) and existing packaging intact.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/nightshade_native

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev \
            libudev-dev libraw-dev tar

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Build Linux release bundle
        run: dart run melos run build:desktop:linux --no-select

      - name: Bundle native libs + verify the bridge is present
        run: |
          set -euo pipefail
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          BUNDLE_LIB="$BUNDLE/lib"
          if [ ! -e "$BUNDLE_LIB/libnightshade_bridge.so" ]; then
            echo "libnightshade_bridge.so is MISSING — the Rust build likely failed." >&2
            ls -l "$BUNDLE_LIB" >&2 || true
            exit 1
          fi
          # The bridge dynamically links libraw; ship it so the release is
          # self-contained (bridge rpath = $ORIGIN).
          LIBRAW_PATH="$(ldconfig -p | awk '/libraw\.so/ {print $NF; exit}')"
          if [ -z "${LIBRAW_PATH:-}" ] || [ ! -e "$LIBRAW_PATH" ]; then
            echo "libraw shared object not found via ldconfig" >&2
            exit 1
          fi
          cp -Lv "$LIBRAW_PATH" "$BUNDLE_LIB/"
          # Bundle sqlite too. sqlite3_flutter_libs dynamically links the host's
          # libsqlite3.so.0; a bundle compiled against this runner's sqlite ABI
          # crashes in sqlite3_initialize when loaded against a *different*
          # system sqlite on the user's distro (e.g. a rolling-release desktop
          # with a much newer sqlite). Ship the matching sqlite and load it via
          # the launcher below so the app is ABI-consistent everywhere.
          SQLITE_PATH="$(ldconfig -p | awk '/libsqlite3\.so\.0/ {print $NF; exit}')"
          if [ -z "${SQLITE_PATH:-}" ] || [ ! -e "$SQLITE_PATH" ]; then
            echo "libsqlite3.so.0 not found via ldconfig" >&2
            exit 1
          fi
          cp -Lv "$SQLITE_PATH" "$BUNDLE_LIB/libsqlite3.so.0"
          # The plugin's DT_NEEDED is "libsqlite3.so.0", but the Dart sqlite3
          # FFI dlopens the unversioned "libsqlite3.so". Provide both names so
          # BOTH resolve to this one bundled copy — otherwise the FFI misses the
          # bundle, falls back to the host's libsqlite3.so, and two mismatched
          # sqlite instances crash in sqlite3_initialize on boot.
          ln -sf libsqlite3.so.0 "$BUNDLE_LIB/libsqlite3.so"
          # Launcher: prepend the bundled lib/ to the loader path so the
          # ABI-matched sqlite/libraw win over whatever the host ships. This is
          # the recommended entry point for the desktop bundle. Written with
          # printf (not a heredoc) so YAML block-indentation can't corrupt it.
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'HERE="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]:-$0}")")" && pwd)"'
            printf '%s\n' 'export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"'
            printf '%s\n' 'exec "$HERE/nightshade_desktop" "$@"'
          } > "$BUNDLE/nightshade"
          chmod +x "$BUNDLE/nightshade"
          ls -l "$BUNDLE_LIB" "$BUNDLE/nightshade"

      - name: Verify glibc floor (Bookworm / Raspberry Pi OS compatibility)
        run: |
          set -euo pipefail
          # The SHIPPED appliance runs on Debian/Raspberry Pi OS Bookworm
          # (glibc 2.36) — both the systemd/Pi installs and the docker appliance
          # (FROM debian:bookworm-slim). A binary needing a newer glibc aborts on
          # boot there with "GLIBC_2.38 not found", invisible to a smoke test on
          # this runner. This job builds on ubuntu-22.04 (glibc 2.35, below the
          # floor) so the check passes by construction; the guard stays as a
          # backstop in case the runner image is ever bumped. (The heavier
          # alternative is scripts/docker_build_linux.sh on debian:bookworm-slim,
          # which runs this same gate internally.)
          FLOOR="${NIGHTSHADE_GLIBC_FLOOR:-2.36}"
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          floor_major=${FLOOR%%.*}; floor_minor=${FLOOR#*.}
          violations=0
          for bin in "$BUNDLE"/nightshade_desktop "$BUNDLE"/lib/*.so; do
            [ -f "$bin" ] || continue
            maxv=$(objdump -T "$bin" 2>/dev/null \
              | grep -oE 'GLIBC_2\.[0-9]+' | sort -V | tail -1 || true)
            [ -n "$maxv" ] || continue
            v=${maxv#GLIBC_}; major=${v%%.*}; minor=${v#*.}
            if [ "$major" -gt "$floor_major" ] || \
               { [ "$major" -eq "$floor_major" ] && [ "$minor" -gt "$floor_minor" ]; }; then
              echo "VIOLATION: $(basename "$bin") needs $maxv (> $FLOOR)"
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then
            echo "::error::$violations binary(ies) exceed glibc $FLOOR — this release would NOT boot on the Bookworm appliance. Build on Bookworm (see comment above)."
            exit 1
          fi
          echo "glibc floor OK (no binary exceeds $FLOOR)"

      - name: Package + checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/nightshade-${APP_VERSION}-linux-x64.tar.gz" \
            -C apps/desktop/build/linux/x64/release \
            --transform "s,^bundle,nightshade-${APP_VERSION}-linux-x64," bundle
          (cd dist && sha256sum "nightshade-${APP_VERSION}-linux-x64.tar.gz" \
             > "nightshade-${APP_VERSION}-linux-x64.tar.gz.sha256")
          ls -l dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  windows:
    name: Windows x64
    # Pinned to windows-2022 (not windows-latest): GitHub rolled windows-latest
    # to windows-2025-vs2026 on 2026-06-18, whose newer CMake refuses to extract
    # archives through symlinks and breaks flutter_webrtc's Windows native build
    # ("Cannot extract through symlink ...flutter_webrtc"). windows-2022 is the
    # known-good image yesterday's 4.1.0 build shipped on. TODO: revisit with a
    # durable fix (pin CMake / flutter_webrtc workaround) before windows-2022 is
    # deprecated.
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # The imaging crate's build.rs links libraw; point it at the vendored
      # import lib/DLL so the Rust build is self-contained on a clean runner.
      LIBRAW_DIR: ${{ github.workspace }}\lib\libraw
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/nightshade_native

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      # Build phases run as explicit steps (the melos multi-line `run:` only
      # executes its first line on the Windows shell).
      - name: Build Rust native bridge (release)
        run: cargo build --release --manifest-path native/nightshade_native/bridge/Cargo.toml

      - name: Build Flutter Windows app (release)
        working-directory: apps/desktop
        run: flutter build windows --release

      - name: Stage native DLLs (bridge, libraw, MSVC runtime) into Release
        shell: pwsh
        run: ./scripts/stage_windows_release.ps1 -Profile Release

      - name: Verify the Release output is complete
        shell: pwsh
        run: |
          $rel = "apps/desktop/build/windows/x64/runner/Release"
          $missing = @()
          foreach ($f in @("nightshade_desktop.exe", "nightshade_bridge.dll", "libraw.dll")) {
            if (-not (Test-Path (Join-Path $rel $f))) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Release dir contents:"
            Get-ChildItem $rel | Format-Table Name, Length
            Write-Error "Missing required files in Release output: $($missing -join ', ')"
            exit 1
          }
          Write-Host "Release output verified:"
          Get-ChildItem $rel | Format-Table Name, Length

      - name: Package + checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $rel = "apps/desktop/build/windows/x64/runner/Release"
          $zip = "dist/nightshade-$($env:APP_VERSION)-windows-x64.zip"
          Compress-Archive -Path "$rel/*" -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  nightshade-$($env:APP_VERSION)-windows-x64.zip" `
            | Out-File -Encoding ascii "$zip.sha256"
          Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.apk' -o -name '*.tar.gz' \
            -o -name '*.zip' -o -name '*.sha256' \) -exec cp -v {} release-assets/ \;
          echo "Release assets:"
          ls -l release-assets

      # Fail early with a clear message rather than letting the publish step
      # silently fall back to an empty release body when the notes file for this
      # tag was never written. The file name must match the tag (v4.1.0 ->
      # docs/release/v4.1.0.md).
      - name: Verify release notes exist for this tag
        run: |
          set -euo pipefail
          notes="docs/release/${{ github.ref_name }}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes file '$notes' is missing. Create it before tagging, or the published release would have an empty body."
            exit 1
          fi
          echo "Found release notes: $notes"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Nightshade ${{ github.ref_name }}
          body_path: docs/release/${{ github.ref_name }}.md
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
